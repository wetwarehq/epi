[project]
name = "epi"
version = "0.1.0"
description = "Epidemic labs — scored rooms for agent-colony epidemiology. The room contains no model."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
epi = "epi.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["epi*"]
